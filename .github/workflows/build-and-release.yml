name: Build and Release

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install --ignore-scripts

      - name: Build
        run: npm run build

      - name: Package tarball
        run: |
          npm pack
          echo "VERSION=$(node -p "require('./package.json').version")" >> $GITHUB_ENV
          echo "PACKAGE_FILE=$(ls n8n-nodes-notebooklm-sdk-*.tgz)" >> $GITHUB_ENV

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.VERSION }}
          name: "v${{ env.VERSION }}: notebook.google.com domain fix (patched SDK bundled)"
          body: |
            ## Changes
            - Bundled the patched `notebooklm-sdk` (domain migration to `notebook.google.com`), so installing the node needs no extra download.
            
            ## Installation in n8n
            In your n8n directory (e.g. `~/.n8n/nodes` or in custom community node installation):
            ```bash
            npm install https://github.com/Nikolayco/n8n-nodes-notebooklm-sdk/releases/download/v${{ env.VERSION }}/${{ env.PACKAGE_FILE }}
            ```
          files: |
            ${{ env.PACKAGE_FILE }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
